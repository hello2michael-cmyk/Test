name: Deploy Lumi key server (Cloudflare Worker)

# Deploys klasse6/tutor/worker to Cloudflare and stores its secrets there. Run it from the Actions tab (Run workflow).
# Repository secrets: CLOUDFLARE_API_TOKEN (template "Edit Cloudflare Workers"), CLOUDFLARE_ACCOUNT_ID, LUMI_ACCESS_CODE,
# ANTHROPIC_API_KEY, GOOGLE_TTS_KEY, LIVEAVATAR_API_KEY. Optional repository variables: LIVEAVATAR_AVATAR_ID (default in wrangler.toml:
# Judy Teacher Sitting), LIVEAVATAR_SANDBOX (default true: free test mode; set false once a paid plan is active).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['klasse6/tutor/worker/**']

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: klasse6/tutor/worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the Cloudflare credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            msg="Add the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID first (see klasse6/tutor/README.md)."
            # automatic runs skip quietly until the server is set up; a manual run says what is missing
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "::error::$msg"; exit 1; else echo "::notice::$msg Skipped."; fi
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy
        if: steps.creds.outputs.configured == 'true'
        id: deploy
        run: |
          # repository variables override wrangler.toml only when they are set (an empty value must not erase the avatar)
          args=()
          if [ -n "${{ vars.LIVEAVATAR_AVATAR_ID }}" ]; then args+=(--var "LIVEAVATAR_AVATAR_ID:${{ vars.LIVEAVATAR_AVATAR_ID }}"); fi
          if [ -n "${{ vars.LIVEAVATAR_SANDBOX }}" ]; then args+=(--var "LIVEAVATAR_SANDBOX:${{ vars.LIVEAVATAR_SANDBOX }}"); fi
          set -o pipefail
          if ! npx --yes wrangler@4 deploy "${args[@]}" 2>&1 | tee deploy.log; then
            if grep -q "register a workers.dev subdomain" deploy.log; then
              echo "::error::Cloudflare needs a workers.dev subdomain once: dash.cloudflare.com → Workers & Pages → choose a subdomain, then run this workflow again."
            fi
            exit 1
          fi
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Store the secrets in the worker
        if: steps.creds.outputs.configured == 'true'
        env:
          S_ACCESS_CODE: ${{ secrets.LUMI_ACCESS_CODE }}
          S_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          S_GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          S_LIVEAVATAR_API_KEY: ${{ secrets.LIVEAVATAR_API_KEY }}
        run: |
          for name in ACCESS_CODE ANTHROPIC_API_KEY GOOGLE_TTS_KEY LIVEAVATAR_API_KEY; do
            var="S_$name"; value="${!var}"
            if [ -n "$value" ]; then printf '%s' "$value" | npx --yes wrangler@4 secret put "$name" >/dev/null && echo "$name stored";
            else echo "::warning::$name is not set as a repository secret; that feature stays off."; fi
          done
      - name: Self-test of the live server (what the iPhone does)
        if: steps.creds.outputs.configured == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
          CODE: ${{ secrets.LUMI_ACCESS_CODE }}
          ORIGIN: https://hello2michael-cmyk.github.io
        run: |
          sleep 5
          S="$GITHUB_STEP_SUMMARY"
          echo "### Lumi key server" >> "$S"
          echo "Address: $URL" >> "$S"
          echo "" >> "$S"
          echo "| Check | Result |" >> "$S"
          echo "|---|---|" >> "$S"
          # 1. browser preflight with the headers the Claude SDK sends
          code=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS "$URL/v1/messages" -H "origin: $ORIGIN" -H 'access-control-request-method: POST' -H 'access-control-request-headers: content-type,x-api-key,anthropic-version,x-stainless-helper-method,x-lumi-code')
          echo "| Browser permission (preflight) | HTTP $code (204 = ok) |" >> "$S"
          # 2. Claude through the server (a tiny request)
          body=$(curl -s -X POST "$URL/v1/messages" -H "origin: $ORIGIN" -H "x-lumi-code: $CODE" -H 'content-type: application/json' -H 'anthropic-version: 2023-06-01' \
            -d '{"model":"claude-sonnet-5-5","max_tokens":20,"messages":[{"role":"user","content":"Say: ok"}]}')
          echo "| Claude via server | $(echo "$body" | jq -c 'if .content then "ok: " + (.content[0].text // "") else (.error // .) end' 2>/dev/null | head -c 300) |" >> "$S"
          # 3. natural voice (raw PCM for the video teacher)
          body=$(curl -s -X POST "$URL/tts" -H "origin: $ORIGIN" -H "x-lumi-code: $CODE" -H 'content-type: application/json' -d '{"text":"Hallo.","format":"pcm"}')
          echo "| Voice (Google) | $(echo "$body" | jq -c 'if .audio then "ok: \(.audio | length) characters of audio" else . end' 2>/dev/null | head -c 300) |" >> "$S"
          # 4. LiveAvatar session token (the token itself is never printed)
          body=$(curl -s -X POST "$URL/session" -H "origin: $ORIGIN" -H "x-lumi-code: $CODE")
          echo "| Video teacher (LiveAvatar) | $(echo "$body" | jq -c 'if .session_token then "ok: session token received" else . end' 2>/dev/null | head -c 1200) |" >> "$S"
          cat "$S"
