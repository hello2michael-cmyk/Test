name: YouTube upload package

# Collects every finished lesson video from its release into one organised package (one folder per video with a clean
# name, thumbnail, captions and an upload sheet with all settings) and publishes it as the release "youtube-upload".
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Download the release assets
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          set -e
          for tag in $(node -e "console.log(JSON.parse(require('fs').readFileSync('klasse6/youtube-upload.json','utf8')).videos.map(v=>v.release).join(' '))"); do
            mkdir -p downloads/$tag
            gh release download "$tag" -D "downloads/$tag" --clobber
          done
          du -sh downloads
      - name: Organise the package
        run: node factory/package.mjs downloads package
      - name: Zip each video folder
        run: |
          set -e
          cd package
          for d in */; do d="${d%/}"; zip -q -r "$d.zip" "$d"; rm -r "$d"; done
          ls -la
      - name: Publish as the release youtube-upload
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          set -e
          gh release delete youtube-upload --yes --cleanup-tag 2>/dev/null || true
          gh release create youtube-upload --title "YouTube-Upload-Paket ($(date -u +%Y-%m-%d))" --notes-file package/00-CHECKLISTE.md package/*
          echo "Release: https://github.com/${{ github.repository }}/releases/tag/youtube-upload"
