name: Publish TV Mirror to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages (turns Pages on if it is off)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: daybrief/package-lock.json
      - name: Build Daybrief (Vite) into daybrief/
        run: |
          npm --prefix daybrief ci
          npm --prefix daybrief run build
          mv daybrief/dist /tmp/daybrief-dist
          rm -rf daybrief
          mv /tmp/daybrief-dist daybrief
      - name: Keep only the web apps in the site
        run: rm -rf android .github
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
